<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ bot_name }} - Medical Study Assistant</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@500;700&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,600;1,6..72,400&display=swap" rel="stylesheet">
  <style>
    :root {
      --paper: #e8f0ec;
      --panel: #f7faf8;
      --ink: #12343a;
      --ink-soft: #4d6a6e;
      --line: #c5d6cf;
      --accent: #d9482b;
      --tint: #d3e5df;
      --display: "Bricolage Grotesque", "Segoe UI", sans-serif;
      --body: "Newsreader", Georgia, serif;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    html, body { height: 100%; }

    body {
      background: var(--paper);
      color: var(--ink);
      font-family: var(--body);
      font-size: 18px;
      line-height: 1.6;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }

    .app {
      width: 100%;
      max-width: 1080px;
      height: min(100%, 820px);
      display: grid;
      grid-template-columns: 260px 1fr;
      background: var(--panel);
      border: 2px solid var(--ink);
      border-radius: 6px 28px 6px 28px;
      box-shadow: 8px 8px 0 var(--ink);
      overflow: hidden;
    }

    .rail {
      background: var(--ink);
      color: var(--paper);
      padding: 28px 22px;
      display: flex;
      flex-direction: column;
      gap: 26px;
      overflow-y: auto;
    }

    .brand { display: flex; align-items: center; gap: 12px; }

    .brand-mark {
      width: 42px;
      height: 42px;
      border-radius: 50%;
      background: var(--accent);
      display: grid;
      place-items: center;
      flex-shrink: 0;
    }

    .brand-mark svg { width: 26px; height: 26px; }

    .brand h1 {
      font-family: var(--display);
      font-size: 24px;
      font-weight: 700;
      letter-spacing: -0.02em;
      line-height: 1.1;
    }

    .brand p { font-size: 14px; color: #a9c2bb; font-style: italic; }

    .rail h2 {
      font-family: var(--display);
      font-size: 15px;
      font-weight: 500;
      color: #a9c2bb;
      margin-bottom: 10px;
    }

    .topics { display: flex; flex-direction: column; gap: 8px; }

    .topic {
      font-family: var(--display);
      font-size: 15px;
      font-weight: 500;
      text-align: left;
      color: var(--paper);
      background: transparent;
      border: 1px solid #3b5f64;
      border-radius: 4px 14px 4px 14px;
      padding: 9px 14px;
      cursor: pointer;
      transition: background 0.15s, border-color 0.15s;
    }

    .topic:hover, .topic:focus-visible {
      background: #1d474e;
      border-color: var(--accent);
      outline: none;
    }

    .rail-note {
      margin-top: auto;
      font-size: 14px;
      color: #a9c2bb;
      border-top: 1px solid #2f5157;
      padding-top: 16px;
    }

    .main { display: flex; flex-direction: column; min-width: 0; min-height: 0; }

    .main-head {
      padding: 18px 28px;
      border-bottom: 1px solid var(--line);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }

    .main-head h2 {
      font-family: var(--display);
      font-size: 19px;
      font-weight: 700;
    }

    .pulse { width: 120px; height: 28px; color: var(--accent); }

    .pulse path {
      stroke-dasharray: 260;
      stroke-dashoffset: 260;
      animation: trace 2.4s ease-out forwards;
    }

    @keyframes trace { to { stroke-dashoffset: 0; } }

    .clear-btn {
      font-family: var(--display);
      font-size: 14px;
      font-weight: 500;
      color: var(--ink-soft);
      background: none;
      border: 1px solid var(--line);
      border-radius: 4px 12px 4px 12px;
      padding: 6px 14px;
      cursor: pointer;
    }

    .clear-btn:hover, .clear-btn:focus-visible {
      color: var(--ink);
      border-color: var(--ink);
      outline: none;
    }

    .messages {
      flex: 1;
      overflow-y: auto;
      padding: 28px;
      display: flex;
      flex-direction: column;
      gap: 22px;
      scroll-behavior: smooth;
    }

    .msg { max-width: 82%; }

    .msg .who {
      font-family: var(--display);
      font-size: 13px;
      font-weight: 500;
      color: var(--ink-soft);
      margin-bottom: 4px;
    }

    .msg .bubble { padding: 12px 18px; }

    .msg.bot .bubble {
      background: #fff;
      border-left: 4px solid var(--accent);
      border-radius: 2px 16px 16px 2px;
      box-shadow: 0 1px 0 var(--line);
    }

    .msg.user { align-self: flex-end; }
    .msg.user .who { text-align: right; }

    .msg.user .bubble {
      background: var(--tint);
      border-radius: 16px 2px 2px 16px;
      border-right: 4px solid var(--ink);
    }

    .msg.error .bubble { border-left-color: #8a1c1c; color: #8a1c1c; }

    .bubble p + p, .bubble p + ul, .bubble ul + p { margin-top: 10px; }
    .bubble ul { padding-left: 22px; }
    .bubble li + li { margin-top: 4px; }
    .bubble strong { font-weight: 600; color: var(--ink); }

    .bubble code {
      font-family: ui-monospace, Consolas, monospace;
      font-size: 0.85em;
      background: var(--tint);
      padding: 1px 5px;
      border-radius: 3px;
    }

    .typing svg { width: 90px; height: 26px; color: var(--accent); display: block; }

    .typing path {
      stroke-dasharray: 200;
      animation: beat 1.4s linear infinite;
    }

    @keyframes beat {
      from { stroke-dashoffset: 200; }
      to { stroke-dashoffset: 0; }
    }

    .composer {
      padding: 16px 28px 22px;
      border-top: 1px solid var(--line);
      display: flex;
      gap: 12px;
      align-items: flex-end;
    }

    .composer textarea {
      flex: 1;
      font-family: var(--body);
      font-size: 18px;
      line-height: 1.4;
      color: var(--ink);
      background: #fff;
      border: 2px solid var(--line);
      border-radius: 4px 16px 4px 16px;
      padding: 11px 16px;
      resize: none;
      max-height: 140px;
    }

    .composer textarea:focus { outline: none; border-color: var(--ink); }
    .composer textarea::placeholder { color: #8ba39c; font-style: italic; }

    .send {
      font-family: var(--display);
      font-size: 16px;
      font-weight: 700;
      color: #fff;
      background: var(--accent);
      border: 2px solid var(--ink);
      border-radius: 4px 16px 4px 16px;
      padding: 11px 24px;
      cursor: pointer;
      box-shadow: 3px 3px 0 var(--ink);
      transition: transform 0.1s, box-shadow 0.1s;
    }

    .send:hover:not(:disabled) { transform: translate(1px, 1px); box-shadow: 2px 2px 0 var(--ink); }
    .send:focus-visible { outline: 3px solid var(--ink); outline-offset: 2px; }
    .send:disabled { opacity: 0.5; cursor: not-allowed; }

    @media (max-width: 820px) {
      body { padding: 0; }
      .app {
        grid-template-columns: 1fr;
        grid-template-rows: auto 1fr;
        height: 100%;
        max-width: none;
        border: none;
        border-radius: 0;
        box-shadow: none;
      }
      .rail { padding: 14px 16px; gap: 12px; }
      .rail h2, .rail-note, .brand p { display: none; }
      .topics { flex-direction: row; overflow-x: auto; padding-bottom: 4px; }
      .topic { white-space: nowrap; }
      .pulse { display: none; }
      .messages, .main-head, .composer { padding-left: 16px; padding-right: 16px; }
      .msg { max-width: 92%; }
    }

    @media (prefers-reduced-motion: reduce) {
      .pulse path { animation: none; stroke-dashoffset: 0; }
      .typing path { animation: none; stroke-dashoffset: 0; }
      .messages { scroll-behavior: auto; }
    }
  </style>
</head>
<body>
  <div class="app">
    <aside class="rail">
      <div class="brand">
        <div class="brand-mark" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round">
            <path d="M12 4v16M4 12h16"/>
          </svg>
        </div>
        <div>
          <h1>{{ bot_name }}</h1>
          <p>Medical study assistant</p>
        </div>
      </div>

      <div>
        <h2>Start with a subject</h2>
        <div class="topics">
          <button class="topic" data-prompt="Explain the cardiac cycle step by step.">Cardiac cycle</button>
          <button class="topic" data-prompt="Summarize the mechanism of action of beta blockers.">Beta blockers</button>
          <button class="topic" data-prompt="Explain the stages of glycolysis with key enzymes.">Glycolysis</button>
          <button class="topic" data-prompt="What are the layers of the skin and their functions?">Skin layers</button>
          <button class="topic" data-prompt="Compare Gram-positive and Gram-negative bacteria.">Gram staining</button>
        </div>
      </div>

      <p class="rail-note">For study only. It does not replace a doctor or give personal medical advice.</p>
    </aside>

    <main class="main">
      <header class="main-head">
        <h2>Study session</h2>
        <svg class="pulse" viewBox="0 0 120 28" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M0 14h30l6-10 8 22 7-12h8l4-5 4 5h17"/>
        </svg>
        <button class="clear-btn" id="clearBtn" type="button">Clear chat</button>
      </header>

      <section class="messages" id="messages" aria-live="polite"></section>

      <div class="composer">
        <textarea id="input" rows="1" maxlength="2000" placeholder="Ask a medical study question" aria-label="Your question"></textarea>
        <button class="send" id="sendBtn" type="button">Send</button>
      </div>
    </main>
  </div>

  <script>
    const GREETING = {{ greeting | tojson }};

    const messagesEl = document.getElementById("messages");
    const inputEl = document.getElementById("input");
    const sendBtn = document.getElementById("sendBtn");
    const clearBtn = document.getElementById("clearBtn");

    let history = [];
    let busy = false;

    const PULSE_SVG =
      '<svg viewBox="0 0 90 26" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M0 13h22l5-9 7 20 6-11h6l3-4 3 4h13"/></svg>';

    function escapeHtml(text) {
      return text
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;");
    }

    function inline(text) {
      return escapeHtml(text)
        .replace(/\*\*(.+?)\*\*/g, "<strong>$1</strong>")
        .replace(/`(.+?)`/g, "<code>$1</code>");
    }

    function render(text) {
      const lines = text.split("\n");
      let html = "";
      let inList = false;

      for (const raw of lines) {
        const line = raw.trim();
        const item = line.match(/^(?:[-*]|\d+\.)\s+(.*)$/);

        if (item) {
          if (!inList) { html += "<ul>"; inList = true; }
          html += "<li>" + inline(item[1]) + "</li>";
        } else {
          if (inList) { html += "</ul>"; inList = false; }
          if (line) html += "<p>" + inline(line.replace(/^#+\s*/, "")) + "</p>";
        }
      }

      if (inList) html += "</ul>";
      return html;
    }

    function addMessage(role, text, isError = false) {
      const wrap = document.createElement("div");
      wrap.className = "msg " + role + (isError ? " error" : "");

      const who = document.createElement("div");
      who.className = "who";
      who.textContent = role === "user" ? "You" : "{{ bot_name }}";

      const bubble = document.createElement("div");
      bubble.className = "bubble";
      if (role === "user") bubble.textContent = text;
      else bubble.innerHTML = render(text);

      wrap.append(who, bubble);
      messagesEl.appendChild(wrap);
      messagesEl.scrollTop = messagesEl.scrollHeight;
      return wrap;
    }

    function addTyping() {
      const wrap = document.createElement("div");
      wrap.className = "msg bot";
      wrap.innerHTML =
        '<div class="who">{{ bot_name }}</div><div class="bubble typing" aria-label="Thinking">' + PULSE_SVG + "</div>";
      messagesEl.appendChild(wrap);
      messagesEl.scrollTop = messagesEl.scrollHeight;
      return wrap;
    }

    function setBusy(state) {
      busy = state;
      sendBtn.disabled = state;
    }

    async function send(text) {
      const message = text.trim();
      if (!message || busy) return;

      addMessage("user", message);
      inputEl.value = "";
      inputEl.style.height = "auto";
      setBusy(true);

      const typing = addTyping();

      try {
        const response = await fetch("/chat", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ message, history })
        });
        const data = await response.json();
        typing.remove();

        if (!response.ok) {
          addMessage("bot", data.error || "Something went wrong.", true);
        } else {
          addMessage("bot", data.reply);
          history.push({ role: "user", text: message }, { role: "bot", text: data.reply });
        }
      } catch (error) {
        typing.remove();
        addMessage("bot", "Could not reach the server. Check your connection and try again.", true);
      } finally {
        setBusy(false);
        inputEl.focus();
      }
    }

    function resetChat() {
      history = [];
      messagesEl.innerHTML = "";
      addMessage("bot", GREETING);
    }

    sendBtn.addEventListener("click", () => send(inputEl.value));

    inputEl.addEventListener("keydown", (event) => {
      if (event.key === "Enter" && !event.shiftKey) {
        event.preventDefault();
        send(inputEl.value);
      }
    });

    inputEl.addEventListener("input", () => {
      inputEl.style.height = "auto";
      inputEl.style.height = Math.min(inputEl.scrollHeight, 140) + "px";
    });

    clearBtn.addEventListener("click", resetChat);

    document.querySelectorAll(".topic").forEach((button) => {
      button.addEventListener("click", () => send(button.dataset.prompt));
    });

    resetChat();
  </script>
</body>
</html>
